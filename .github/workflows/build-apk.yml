name: Build Teto Pet APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Find and extract project
        run: |
          echo "Archivos recibidos por GitHub:"
          find . -maxdepth 4 -type f
          ZIP="$(find . -type f -iname 'tetopetmobile-source.zip' -print -quit)"
          if [ -n "$ZIP" ]; then
            mkdir -p /tmp/teto
            unzip -q "$ZIP" -d /tmp/teto
            cp -r /tmp/teto/TetoPetMobile/. . 2>/dev/null || cp -r /tmp/teto/. .
          else
            echo "No se encontró el ZIP. Se usarán los archivos subidos directamente."
          fi
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: TetoPetMobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
